<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Matrix Innovation Admin</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/admin.css">
</head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/matrix-config.js"></script>
<script>
window.ADMIN = {
  title: "Matrix Innovation Admin",
  tabs: [
    { label: "Contact details", table: "site_settings", like: ["key","innovation_%"], pk: "key", order: {col:"key",asc:true}, noAdd: true, noDelete: true,
      hint: "Changes here update the Call, WhatsApp, Email and Instagram links on /innovation.",
      cols: [{k:"key",l:"Setting"},{k:"value",l:"Value"}],
      fields: [{k:"key",l:"Setting",ro:true},{k:"value",l:"Value",req:true,hk:"hint"}] },
    { label: "Orders", table: "innovation_orders", noAdd: true,
      cols: [{k:"created_at",l:"Received",t:"date"},{k:"customer_name",l:"Customer"},{k:"mobile",l:"Mobile",t:"wa"},{k:"items",l:"Items"},{k:"total",l:"Total (₹)"},{k:"status",l:"Status"}],
      fields: [{k:"customer_name",l:"Customer",ro:true},{k:"mobile",l:"Mobile",ro:true},{k:"items",l:"Items",t:"textarea",ro:true},{k:"message",l:"Customer message",t:"textarea",ro:true},{k:"total",l:"Total (₹)",t:"number"},{k:"status",l:"Status",t:"select",o:["new","contacted","done","cancelled"]},{k:"notes",l:"Internal notes",t:"textarea"}] },
    { label: "Products", table: "innovation_products", order: {col:"sort",asc:true},
      cols: [{k:"image_url",l:"Image",t:"img"},{k:"name",l:"Product"},{k:"category",l:"Category"},{k:"price",l:"Price (₹)"},{k:"active",l:"Visible",t:"checkbox"}],
      fields: [{k:"name",l:"Product",req:true},{k:"category",l:"Category"},{k:"price",l:"Price (₹)",t:"number"},{k:"image_url",l:"Image URL"},{k:"description",l:"Description",t:"textarea"},{k:"sort",l:"Order",t:"number"},{k:"active",l:"Visible on site",t:"checkbox"}] },
    { label: "Offers", table: "innovation_offers", order: {col:"sort",asc:true},
      cols: [{k:"image_url",l:"Poster",t:"img"},{k:"title",l:"Title"},{k:"sort",l:"Order"},{k:"active",l:"Visible",t:"checkbox"}],
      fields: [{k:"title",l:"Title",req:true},{k:"image_url",l:"Poster image URL"},{k:"sort",l:"Order",t:"number"},{k:"active",l:"Visible on site",t:"checkbox"}] }
  ]
};
</script>
<script src="/admin.js"></script>
</body></html>
