<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Matrix Tech Admin</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/admin.css">
</head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/matrix-config.js"></script>
<script>
window.ADMIN = {
  title: "Matrix Tech Admin",
  tabs: [
    { label: "Contact details", table: "site_settings", like: ["key","tech_%"], pk: "key", order: {col:"key",asc:true}, noAdd: true, noDelete: true,
      hint: "Changes here update the WhatsApp, Call and Email links on /tech. WhatsApp enquiries go to the WhatsApp number.",
      cols: [{k:"key",l:"Setting"},{k:"value",l:"Value"}],
      fields: [{k:"key",l:"Setting",ro:true},{k:"value",l:"Value",req:true,hk:"hint"}] },
    { label: "Enquiries", table: "tech_enquiries", noAdd: true,
      cols: [{k:"created_at",l:"Received",t:"date"},{k:"name",l:"Name"},{k:"mobile",l:"Mobile",t:"wa"},{k:"category",l:"Service"},{k:"problem",l:"Problem"},{k:"location",l:"Location"},{k:"status",l:"Status"}],
      fields: [{k:"name",l:"Name",ro:true},{k:"mobile",l:"Mobile",ro:true},{k:"email",l:"Email",ro:true},{k:"category",l:"Service",ro:true},{k:"device_type",l:"Device",ro:true},{k:"preferred_date",l:"Preferred date",ro:true},{k:"location",l:"Location",ro:true},{k:"problem",l:"Problem",t:"textarea",ro:true},{k:"status",l:"Status",t:"select",o:["new","contacted","done","cancelled"]},{k:"notes",l:"Internal notes",t:"textarea"}] },
    { label: "AMC plans", table: "tech_amc_plans", order: {col:"sort",asc:true},
      cols: [{k:"name",l:"Plan"},{k:"price",l:"Price (₹)"},{k:"period",l:"Period"},{k:"sort",l:"Order"},{k:"active",l:"Visible",t:"checkbox"}],
      fields: [{k:"name",l:"Plan name",req:true},{k:"price",l:"Price (₹)",t:"number"},{k:"period",l:"Period"},{k:"features",l:"Features (one per line)",t:"textarea"},{k:"sort",l:"Order",t:"number"},{k:"active",l:"Visible on site",t:"checkbox"}] },
    { label: "Products", table: "tech_products", order: {col:"sort",asc:true},
      cols: [{k:"name",l:"Product"},{k:"price",l:"Price (₹)"},{k:"sort",l:"Order"},{k:"active",l:"Visible",t:"checkbox"}],
      fields: [{k:"name",l:"Product",req:true},{k:"price",l:"Price (₹)",t:"number"},{k:"description",l:"Description",t:"textarea"},{k:"sort",l:"Order",t:"number"},{k:"active",l:"Visible on site",t:"checkbox"}] }
  ]
};
</script>
<script src="/admin.js"></script>
</body></html>
